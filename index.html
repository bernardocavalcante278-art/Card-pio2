<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <header id="topo">
          <h1>Lanchonete do Joel</h1>
         <p>Cardápio de hoje</p>
    </header>
    <main>
        <p id="resumo" class="aviso">Nenhum item selecionado</p>
        <section class="card destaque">
            <h2>X-Burguer</h2>
            <p>Pão, hamburguer e queijo</p>
            <span class="valor">R$ 30,00</span>
        </section>
        <section class="card">
            <h2>X-Salada</h2>
            <p>Pão, hamburguer, queijo, alface e tomate</p>
            <span class="valor">R$ 25,00</span>
        </section>
        <section class="card">
            <h2>X-Egg</h2>
            <p>Pão, hamburguer, queijo e ovo</p>
            <span class="valor">R$ 25,00</span>
        </section>
        <button id="limpar">Limpar seleção</button>
    </main>
    <footer id="contato">Pedidos:(61) 9990623793</footer>
    <script src="script.js"></script>
</body>
</html>
